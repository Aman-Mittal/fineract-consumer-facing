# Frozen-violation ratchet for the architecture tests (FreezingArchRule).
# See docs/consumer/architecture/ for the workflow.

# One licensed, sorted text file per frozen rule; existing files may only shrink.
freeze.store=org.apache.fineract.consumer.testsupport.ShrinkOnlyViolationStore
# Relative to the Gradle project directory (consumer/), the test working directory.
freeze.store.default.path=src/test/resources/archunit_store
# A frozen rule without a committed store file fails. Record a newly frozen rule once with
# ./gradlew test --tests '*Architecture*' -ParchunitFreezeNewRules, then commit the new file.
freeze.store.default.allowStoreCreation=false
# Fixed violations are dropped from the store on the next run; commit the shrunken file.
freeze.store.default.allowStoreUpdate=true
# Never re-record the current violations as the new baseline.
freeze.refreeze=false
