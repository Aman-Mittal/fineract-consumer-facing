# Runs the BFF as the GraalVM native image instead of the JVM jar. Build the binary first:
#
#   ./gradlew -Pnative nativeCompile
#   docker compose -f compose.yaml -f compose.native.yaml up -d --build --wait
#
# The Cucumber suite runs against it unchanged (./gradlew cucumber).
services:
  bff:
    build:
      context: .
      dockerfile: Dockerfile.native
    environment:
      # The native binary does not read JAVA_TOOL_OPTIONS, and the JaCoCo agent cannot attach to it;
      # coverage comes from the JVM run.
      JAVA_TOOL_OPTIONS: ""
    volumes: !override
      - ./dev-jwt-key.pem:/etc/bff/jwt-key.pem:ro
